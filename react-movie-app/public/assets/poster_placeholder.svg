<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181c2b"/>
      <stop offset="50%" stop-color="#10131f"/>
      <stop offset="100%" stop-color="#080a11"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="500" height="750" fill="url(#bgGrad)"/>
  <rect width="500" height="750" fill="url(#glow)"/>

  <!-- Outer Film Card Frame -->
  <rect x="24" y="24" width="452" height="702" rx="16" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2"/>
  <rect x="32" y="32" width="436" height="686" rx="12" fill="none" stroke="rgba(124, 58, 237, 0.2)" stroke-dasharray="8 8" stroke-width="1.5"/>

  <!-- Center Glow Orb -->
  <circle cx="250" cy="300" r="85" fill="url(#accentGrad)" opacity="0.12" filter="url(#softGlow)"/>
  <circle cx="250" cy="300" r="70" fill="#131622" stroke="url(#accentGrad)" stroke-width="2"/>

  <!-- Film Clapperboard / Reel Icon -->
  <g transform="translate(210, 260) scale(1.6)" fill="url(#accentGrad)">
    <!-- Clapper base -->
    <path d="M4 18h42a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2z" opacity="0.9"/>
    <!-- Clapper top stick -->
    <path d="M4 3h42a2 2 0 0 1 2 2v2H2V5a2 2 0 0 1 2-2z" fill="#ffffff" opacity="0.95"/>
    <path d="M12 3l-4 4h4l4-4h-4zm12 0l-4 4h4l4-4h-4zm12 0l-4 4h4l4-4h-4z" fill="#10131f"/>
    <!-- Film slate lines -->
    <line x1="10" y1="13" x2="40" y2="13" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Typography -->
  <text x="250" y="440" font-family="'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="22" fill="#ffffff" text-anchor="middle" letter-spacing="1">
    NO POSTER AVAILABLE
  </text>
  <text x="250" y="475" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="14" fill="#9ca3af" text-anchor="middle" letter-spacing="0.5">
    Official Artwork Pending
  </text>

  <!-- CineVerse Branding Badge -->
  <g transform="translate(185, 640)">
    <rect width="130" height="28" rx="14" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
    <circle cx="20" cy="14" r="4" fill="#06b6d4"/>
    <text x="70" y="19" font-family="'Outfit', sans-serif" font-weight="600" font-size="12" fill="#d1d5db" text-anchor="middle" letter-spacing="1">
      CINEVERSE
    </text>
  </g>
</svg>
