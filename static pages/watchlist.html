<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="View and manage your saved collection of movies. Track and organize what you want to watch next on CineVerse.">
    <title>CineVerse - My Movie Watchlist</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Navigation -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark navbar-custom fixed-top py-3" id="main-nav">
            <div class="container">
                <a class="navbar-brand d-flex align-items-center" href="index.html" id="brand-logo">
                    <i class="bi bi-film me-2"></i>CineVerse
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation" id="nav-toggle-btn">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarContent">
                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html" id="link-home">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="search.html" id="link-search">Search</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="watchlist.html" id="link-watchlist">Watchlist</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <!-- Main Content Area -->
    <main style="padding-top: 120px;" class="min-vh-100 container">
        <section id="watchlist-display-section" class="py-2">
            <div class="d-flex align-items-center justify-content-between mb-4 border-bottom border-secondary pb-3">
                <h1 class="h2 mb-0" id="watchlist-title-header"><i class="bi bi-bookmarks text-purple me-2"></i>My Watchlist</h1>
                <span class="badge bg-secondary px-3 py-2" id="watchlist-counter-badge" style="font-size: 0.9rem;">
                    Local Memory
                </span>
            </div>
            
            <div class="row g-4" id="watchlist-grid">
                <!-- Watchlist movie cards rendered dynamically by Javascript -->
            </div>
        </section>
    </main>

    <!-- Footer Area -->
    <footer class="py-5 text-center text-secondary mt-5" id="main-footer">
        <div class="container">
            <p class="mb-2"><span class="text-white fw-bold"><i class="bi bi-film me-2"></i>CineVerse</span> - Premium Static Movie Portal</p>
            <p class="small text-secondary-50">&copy; 2026 CineVerse. Built with Bootstrap and Vanilla JS for frontend exploration.</p>
            <div class="d-flex justify-content-center gap-3 mt-3">
                <a href="#" class="text-secondary hover-text-white" aria-label="Privacy Policy"><i class="bi bi-shield-lock-fill"></i></a>
                <a href="#" class="text-secondary hover-text-white" aria-label="Github"><i class="bi bi-github"></i></a>
                <a href="#" class="text-secondary hover-text-white" aria-label="Terms of Service"><i class="bi bi-file-earmark-text-fill"></i></a>
            </div>
        </div>
    </footer>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Watchlist Core & Logic Script -->
    <script src="watchlist.js"></script>
</body>
</html>
